name: Feature request
description: Propose a focused improvement to personal AI continuity or knowledge governance.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What concrete workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Describe the minimal behavior that would solve the problem.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Vault and compiler
        - MCP server
        - Agent Skills
        - Import and portability
        - Host integration
        - Documentation and onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs and boundaries
      description: Note privacy, compatibility, complexity, or migration implications.
