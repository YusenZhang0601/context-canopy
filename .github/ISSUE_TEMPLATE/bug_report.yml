name: Bug report
description: Report a reproducible ContextCanopy defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal Vault content, credentials, private repository URLs, or security exploits. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected behavior and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest synthetic fixture and exact commands needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js, Python, Agent host, and relevant client versions.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: Paste only non-sensitive output from the relevant compiler, tests, or smoke checks.
